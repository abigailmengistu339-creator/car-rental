<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Premium Amber / Orange Fleet Gradient -->
    <linearGradient id="fleetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Window Gradient / Cutout Depth -->
    <linearGradient id="windowTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Chrome Tab Contrast -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="3" y="3" width="58" height="58" rx="15" ry="15" fill="url(#fleetBg)" filter="url(#badgeShadow)" />

  <!-- Inner Top Rim Highlight (Luxury Glass Feel) -->
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="14.25" ry="14.25" fill="none" stroke="url(#topGlow)" stroke-width="1.5" />

  <!-- Vehicle Silhouette Group -->
  <g id="car-emblem">
    <!-- Main Car Body (Crisp Solid White for Ultra-High Visibility at 16x16) -->
    <path d="
      M 11 38
      C 10.4 38 10 37.4 10 36.6
      L 10.2 33.5
      C 10.4 31.8 11.2 30.2 12.5 29.1
      L 18.2 24.3
      C 20.1 22.7 22.4 21.8 24.8 21.8
      L 38.6 21.8
      C 41.2 21.8 43.6 22.8 45.4 24.7
      L 50.8 30.2
      C 52.4 31.8 53.6 33.8 53.9 36
      L 54 36.6
      C 54 37.4 53.4 38 52.6 38
      L 48.5 38
      A 6.5 6.5 0 0 0 35.5 38
      L 26.5 38
      A 6.5 6.5 0 0 0 13.5 38
      Z
    " fill="#ffffff" />

    <!-- Window Cutouts (Sleek Aerodynamic Tint) -->
    <!-- Rear / Quarter Window -->
    <path d="
      M 21.5 24.2
      L 28.5 24.2
      L 28.5 30.5
      L 16.5 30.5
      C 18.2 27.5 19.6 25.5 21.5 24.2
      Z
    " fill="url(#windowTint)" />

    <!-- Front Windshield & Side Window -->
    <path d="
      M 31 24.2
      L 38 24.2
      C 39.8 24.2 41.4 24.9 42.6 26.2
      L 46.2 30.5
      L 31 30.5
      Z
    " fill="url(#windowTint)" />

    <!-- Sleek Aerodynamic Speed Cut / Body Swage Line -->
    <path d="M 12 33 L 52 33" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Wheels (Deep Amber Hub with White Outer Ring) -->
    <!-- Rear Wheel -->
    <circle cx="20" cy="38" r="5.2" fill="#78350f" />
    <circle cx="20" cy="38" r="3.2" fill="#ffffff" />
    <circle cx="20" cy="38" r="1.5" fill="#f59e0b" />

    <!-- Front Wheel -->
    <circle cx="42" cy="38" r="5.2" fill="#78350f" />
    <circle cx="42" cy="38" r="3.2" fill="#ffffff" />
    <circle cx="42" cy="38" r="1.5" fill="#f59e0b" />

    <!-- Front LED Headlight Beam Accent -->
    <path d="M 48.5 32 L 53 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Tail Lamp Accent -->
    <path d="M 10.5 32 L 13 32" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>