<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Fleet Directory PRO — Enterprise Vehicle & Contact Operations</title>
    <meta name="description" content="All-in-one enterprise platform for vehicle tracking, regulatory document compliance, driver allocation, and operational intelligence." />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fleet Directory PRO — Enterprise Vehicle & Contact Operations" />
    <meta property="og:description" content="Centralize fleet operations, verify driver documentation, and track vehicle compliance in real time." />
    <meta property="og:site_name" content="Fleet Directory PRO" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fleet Directory PRO" />
    <meta name="twitter:description" content="Centralize fleet operations, verify driver documentation, and track vehicle compliance in real time." />

    <!-- Mobile PWA & Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fleet PRO" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070b14" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Anti-FOUC Theme Initializer -->
    <script>
      (function() {
        var theme = localStorage.getItem('fleet-theme');
        var resolved = theme === 'dark' ? 'dark' : theme === 'light' ? 'light' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
